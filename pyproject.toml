[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-mcp"
version = "0.1.0"
description = "Transport shell for a YouTube publishing MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastmcp>=2.14,<3", "uvicorn>=0.35,<1"]

[project.scripts]
youtube-mcp = "youtube_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
